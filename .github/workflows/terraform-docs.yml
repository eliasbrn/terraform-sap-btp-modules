name: terraform-docs

on:
  push:
    branches: [main]
    paths:
      - "**/*.tf"

permissions:
  contents: write

jobs:
  docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install terraform-docs
        env:
          VERSION: v0.24.0
        run: |
          curl -sSLo terraform-docs.tar.gz \
            "https://github.com/terraform-docs/terraform-docs/releases/download/${VERSION}/terraform-docs-${VERSION}-linux-amd64.tar.gz"
          tar -xzf terraform-docs.tar.gz terraform-docs
          chmod +x terraform-docs
          sudo mv terraform-docs /usr/local/bin/
          rm terraform-docs.tar.gz
          terraform-docs --version

      - name: Create README for each module
        run: |
          # Each directory with .tf-files is treated as module
          find . -name "*.tf" \
            -not -path "./.git/*" \
            -not -path "*/.terraform/*" \
            -exec dirname {} \; | sort -u | while read -r dir; do
              echo "Creating module-docs for: $dir"
              terraform-docs markdown table "$dir" > "$dir/README.md"
          done

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "**/README.md"
          if git diff --cached --quiet; then
            echo "No Changes to the docs"
          else
            git commit -m "terraform-docs: update module-docs"
            git push
          fi